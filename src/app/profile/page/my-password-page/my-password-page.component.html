<section class="border-2 border-slate-200 px-5 py-10 rounded-lg space-y-3 shadow-2xl" >
    <h2 class="uppercase font-secondary text-2xl text-dashboard-2 font-black" >Mi contraseña</h2>
    <p class="font-primary text-lg text-dashboard-5 font-medium" >Aqui podras cambiar tu contraseña</p>
    <form class="grid grid-cols-2 gap-x-4 gap-y-3" [formGroup]="myForm" >
        <div class="col-span-2 flex flex-col space-y-2">
            <label for="oldPassword" class="font-primary text-dashboard-1 text-lg font-semibold" >Contraseña actual : </label>
            <input type="password"
             id="oldPassword"
             placeholder="Contraseña actual" 
             formControlName="oldPassword" 
             class="font-primary focus:border-dashboard-2 w-full pl-5 py-2 outline-none border-[1.5px] border-dashboard-6 rounded-lg" >
             <span *ngIf="isValidField('oldPassword')" class="text-dashboard-5 font-primary font-medium text-sm" >
                {{getFieldError('oldPassword')}}
            </span>
        </div>
        <div class="col-span-2 flex flex-col space-y-2">
            <label for="newPassword" class="font-primary text-dashboard-1 text-lg font-semibold" >Nueva contraseña : </label>
            <input type="password"
             id="newPassword"
             placeholder="Nueva contraseña" 
             formControlName="newPassword" 
             class="font-primary focus:border-dashboard-2 w-full pl-5 py-2 outline-none border-[1.5px] border-dashboard-6 rounded-lg" >
             <span *ngIf="isValidField('newPassword')" class="text-dashboard-5 font-primary font-medium text-sm" >
                {{getFieldError('newPassword')}}
            </span>
        </div>
        <div class="col-span-2 flex flex-col space-y-2">
            <label for="repassword" class="font-primary text-dashboard-1 text-lg font-semibold" >Repetir contraseña : </label>
            <input type="password"
             id="repassword"
             placeholder="Repetir contraseña" 
             formControlName="repassword" 
             class="font-primary focus:border-dashboard-2 w-full pl-5 py-2 outline-none border-[1.5px] border-dashboard-6 rounded-lg" >
             <span *ngIf="isValidField('repassword')" class="text-dashboard-5 font-primary font-medium text-sm" >
                Ambas contraseñas deben de ser iguales
            </span>
        </div>
        <div class="col-span-2 pt-4">
            <button
            (click)="openDialog()"
            class="bg-dashboard-1 px-3 py-2 font-primary rounded-lg text-lg text-white hover:text-dashboard-3 cursor-pointer"
            type="button"
            >Guardar cambios </button>
        </div>
    </form>
</section>

<p-toast></p-toast>
