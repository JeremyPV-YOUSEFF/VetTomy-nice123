<div class="">
    <div class="font-primary flex justify-between">
        <h4 class="text-dashboard-2 font-semibold text-2xl py-2">Cambia tu contraseña</h4>
        <button type="button" (click)="closeDialog()" class="cursor-pointer"  >
            <i class="fa-solid fa-xmark fa-2xl text-red-400 cursor-pointer"></i>
        </button>
    </div>
    <form [formGroup]="myForm" (submit)="changePassword()" class="space-y-4" >
        <div >
            <h4 class="font-primary text-lg font-semibold text-dashboard-1">Contraseña</h4>
            <section class="flex bg-dashboard-3 px-2 py-2 ">
                <span class="pr-3">
                    <i class="fa-solid fa-key fa-sm text-dashboard-5 text-lg"></i>
                </span>
                <input 
                class="outline-none h-full w-full font-secondary  text-dashboard-5 text-xl font-medium"
                formControlName="password" 
                type="password" 
                placeholder="Contraseña">
            </section>
            <span *ngIf="isValidField('password')" class="text-dashboard-5 font-primary font-medium text-sm" >
                {{getFieldError('password')}}
            </span>
        </div>
        <div >
            <h4 class="font-primary text-lg font-semibold text-dashboard-1">Repetir contraseña</h4>
            <section class="flex bg-dashboard-3 px-2 py-2 ">
                <span class="pr-3">
                    <i class="fa-solid fa-lock fa-sm text-dashboard-5 text-lg"></i>
                </span>
                <input 
                class="outline-none h-full w-full font-secondary  text-dashboard-5 text-xl font-medium"
                formControlName="repassword" 
                type="password" 
                placeholder="Repetir contraseña">
            </section>
            <span *ngIf="isValidField('repassword')" class="text-dashboard-5 font-primary font-medium text-sm" >
                Ambas contraseñas deben de ser iguales
            </span>
        </div>
        <div class="flex justify-between pt-8 font-primary">
            <button
            type="button"
            [disabled]="this.state == 'Loading'"
            (click)="closeDialog()"
            class="bg-red-400 hover:bg-dashboard-3 px-3 py-2 rounded-lg text-lg cursor-pointer text-white font-semibold"
            >Cancelar</button>
    
            <button 
            (click)="changePassword()"
            [disabled]="this.state == 'Loading'"
            [ngClass]="{
                'bg-dashboard-2 cursor-progress': this.state === 'Loading',
                'bg-dashboard-3': this.state == 'Success',
                'bg-red-400  cursor-not-allowed': this.state == 'Error',
                'bg-dashboard-1 hover:text-dashboard-3 cursor-pointer': this.state == '',
             }"
            type="button"
            class=" flex items-center space-x-4 px-10 py-2 text-white font-primary rounded-xl text-xl font-semibold "
            >
                <h5>{{this.state=='Loading' ? 'Cargando' : (this.state == 'Error' ? 'Error' : 'Validar'  )  }}</h5>
                <i *ngIf="this.state == 'Loading'" class="fa-solid fa-circle-notch animate-spin"></i>
            </button>
        </div>
    </form>
</div>

<p-toast></p-toast>
