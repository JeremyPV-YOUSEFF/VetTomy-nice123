<article class="bg-white shadow-xl w-[56rem] h-[43rem] grid grid-cols-2">
    <section class="flex flex-col justify-center items-center space-x-4 space-y-4">
        <div class="flex space-x-3 space-y-3">
            <div 
            routerLink="/dashboard/home"
            class="flex cursor-pointer justify-center items-center size-8 rounded-full bg-dashboard-3"><i class="fa-solid fa-arrow-left fa-lg text-dashboard-1"></i>
            </div>
            <img src="./assets/image/logo.jpg" alt="" class="size-10 rounded-full">
            <h4 class="font-secondary text-4xl font-bold text-dashboard-1" >Veterinaria <span class="text-dashboard-2">Tomy</span></h4>
        </div>
        <div class="flex items-center flex-col space-y-3">
            <h4 class="font-primary text-4xl text-dashboard-2 font-semibold" >Iniciar Sesión</h4>
            <div class="">
                <auth-button-google (onClick)="submitWithGoogle()" ></auth-button-google>
            </div>
            <h5 class="font-primary font-medium" >O</h5>
        </div>
        <form [formGroup]="myForm" (ngSubmit)="signIn()"  class="space-y-5" >
            <div class=" w-80">
                <section class="flex bg-dashboard-3 px-2 py-2">
                    <span class="pr-3">
                        <i class="fa-regular fa-envelope fa-sm text-dashboard-5 text-lg"></i>
                    </span>
                    <input 
                    class="outline-none h-full w-full font-secondary  text-dashboard-5 text-xl font-medium"
                    formControlName="email" 
                    type="text" 
                    placeholder="Correo electronico">
                </section>
                <span *ngIf="isValidField('email')" class="text-dashboard-5 font-primary font-medium text-sm" >
                    {{getFieldError('email')}}
                </span>
            </div>

            <div >
                <section class="flex bg-dashboard-3 px-2 py-2 ">
                    <span class="pr-3">
                        <i class="fa-solid fa-key fa-sm text-dashboard-5 text-lg"></i>
                    </span>
                    <input 
                    class="outline-none h-full w-full font-secondary  text-dashboard-5 text-xl font-medium"
                    formControlName="password" 
                    type="password" 
                    placeholder="Contraseña">
                </section>
                <span *ngIf="isValidField('password')" class="text-dashboard-5 font-primary font-medium text-sm" >
                    {{getFieldError('password')}}
                </span>
            </div>
            
            <div 
            (click)="openPopup()"
            class="">
                <h4 class="underline text-lg text-dashboard-5 font-primary text-center hover:text-dashboard-2 cursor-pointer" >¿Olvidaste tu contraseña?</h4>
            </div>

            <button 
            [disabled]="this.state == 'Loading'"
            (click)="signIn()"
            [ngClass]="{
                'bg-dashboard-2 cursor-progress': this.state === 'Loading',
                'bg-dashboard-3': this.state == 'Success',
                'bg-red-400  cursor-not-allowed': this.state == 'Error',
                'bg-dashboard-1 hover:text-dashboard-3 cursor-pointer': this.state == '',
             }"
            type="submit"
            class=" flex items-center space-x-4 px-10 py-2 text-white font-primary rounded-xl text-xl font-semibold "
            >
            <h5>{{this.state=='Loading' ? 'Cargando' : (this.state == 'Error' ? 'Error' : 'Iniciar Sesión'  )  }}</h5>
            <i *ngIf="this.state == 'Loading'" class="fa-solid fa-circle-notch animate-spin"></i>
            </button>
        </form>
    </section>
    <section 
    class="font-primary  bg-dashboard-1 rounded-l-full flex items-center justify-center flex-col space-y-5">
        <h3 class=" text-5xl text-white font-semibold">¡Bienvenido!</h3>
        <p class="text-sm text-white px-20" >Ingrese sus datos para que pueda acceder a todas las funciones del sitio</p>
        <button 
        type="button" 
        [routerLink]="['/auth/sign-up']" routerLinkActive="router-link-active" 
        class="w-max border-2 text-dashboard-3 text-xl cursor-pointer hover:border hover:bg-dashboard-3 hover:text-dashboard-4 rounded-lg px-3 py-2 border-white" >Registrarse</button>    
    </section>
</article>

<p-toast>
</p-toast>
