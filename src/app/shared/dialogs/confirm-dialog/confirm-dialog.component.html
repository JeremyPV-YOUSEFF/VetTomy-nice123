<div class="p-dialog-mask">
    <section class="w-full h-full bg-white  pt-1 space-y-3">
        <div class="flex items-center space-x-5">
            <i class="fa-solid fa-circle-exclamation fa-2xl text-dashboard-2"></i>
            <p class="font-primary text-lg text-dashboard-5" >¿Estas seguro de editar esta informacion?</p>
        </div>
        <div class="flex justify-end space-x-4 font-primary">
            <button
            (click)="closePopup()"
            type="button"
            class="bg-dashboard-2 rounded-lg text-white px-3 py-2 cursor-pointer hover:text-dashboard-3"
            >Cancelar</button>
            <button
            (click)="ref.close(true)"
            type="button"
            class="bg-dashboard-1 rounded-lg text-white px-3 py-2 cursor-pointer hover:text-dashboard-3"
            >Confirmar</button>
        </div>
    </section>
</div>
