    <h3 class="title">Todo al menor precio</h3>
    <h4 class="subtitle">Aprovecha nuestras ofertas</h4>
    @if (listProducts.length > 0) {
        <section class="grid grid-cols-2 gap-10 py-5">
            @for (product of listProducts; track $index) {
                <store-card-on-sale-product [product]="product" ></store-card-on-sale-product>
            }
        </section>
        <div class="w-full flex justify-center space-x-3" >
            @for (item of [].constructor(paginateProduct?.totalPages); track $index) {
                <span
                (click)="onChangePage($index+1)"
                [ngClass]="indiceByPage == $index+1 ? 'bg-dashboard-3' : 'bg-dashboard-1' "
                class="w-8 h-5 rounded-xl cursor-pointer"></span> 
            }
        </div>
    }@else {
        <shared-loading-text [type]="7"></shared-loading-text>
    }
</article>
