<section class="w-full min-h-screen relative">
    <shared-slider-image [type]="'Home'" ></shared-slider-image>
    @defer (on viewport) {
        <home-bussiness-information [data]="dataBusiness" ></home-bussiness-information>
    }@placeholder {
        <h3>Cargando</h3>
    }
    @defer (on viewport) {
        <home-list-employees [data]="listEmployee" ></home-list-employees>
    }@placeholder {
        <h3>Cargando</h3>
    }
    @defer (on viewport) {
        <home-slider-service></home-slider-service>
    }@placeholder {
        <h3>Cargando</h3>
    }
    @defer (on viewport) {
        <home-slider-product [typeScreen]="'HomePage'" ></home-slider-product>
    }@placeholder {
        <h3>Cargando</h3>
    }
    <shared-contact></shared-contact>
</section>
