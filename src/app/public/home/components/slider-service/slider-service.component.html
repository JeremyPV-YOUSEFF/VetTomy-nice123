<article class="py-10 space-y-4 mx-g">
    <h3 class="title" >Confia en nostros</h3>
    <h4 class="subtitle" >Nuestros servicios</h4>
    @if (listServices.length > 0) {
        <section class="grid grid-cols-12 gap-10">
            <ul class="col-span-3 rounded-lg space-y-2">
                @for (service of listServices; track $index) {
                    <li 
                    (click)="changeService(service.id)"
                    [class]="idService === service.id ? 'bg-dashboard-1 border-none' : 'bg-white border-2 border-slate-200' "
                    class="w-full hover:bg-dashboard-1 h-28 rounded-lg group cursor-pointer flex flex-col justify-center items-center space-y-5">
                        <i
                        [class]="idService === service.id ? 'text-white' : 'text-dashboard-2' " 
                        class="fa-solid fa-heart-pulse group-hover:text-dashboard-3 fa-xl
                        "></i>
                        <h5 
                        [class]="idService === service.id ? 'text-white' : 'text-dashboard-5' " 
                        class="font-primary font-semibold text-xl group-hover:text-dashboard-3">{{service.name}}</h5>
                    </li>
                }
                <button
                (click)="navigate()"
                class="buttonCustome cursor-pointer"
                type="button"
                >
                    Ver mas
                </button>
            </ul>
            <div class="col-span-9 ">
                <home-card-slider-service [idService]="idService" ></home-card-slider-service>
            </div>
        </section>
    }@else {
        <shared-loading-text class="cursor-progress" [type]="4" ></shared-loading-text>
    }
    
</article>
